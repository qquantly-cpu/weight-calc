<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="dark">
<script async src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Калькулятор нормы веса</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
<style>
:root{--bg:#12141a;--surface2:#232733;--line:#2f3443;--text:#e9ebf2;--muted:#8f96a8;--accent:#8ab4ff;--under:#5aa9ff;--ok:#4fd1a5;--over:#f2b84b;--obese:#f0705f;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;color-scheme:dark;-webkit-text-size-adjust:100%}
body{position:fixed;inset:0;width:100%;background:var(--bg);color:var(--text);font-family:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,label{touch-action:manipulation}
/* фон */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;--tone:var(--ok)}
.bg::before{content:"";position:absolute;inset:-60px;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse at 50% 40%,#000 25%,transparent 75%);mask-image:radial-gradient(ellipse at 50% 40%,#000 25%,transparent 75%);animation:grid 12s linear infinite}
.orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.42;will-change:transform}
.o1{width:46vmax;height:46vmax;left:-14vmax;top:-16vmax;background:#3d6df2;animation:d1 22s ease-in-out infinite alternate}
.o2{width:38vmax;height:38vmax;right:-12vmax;top:18vh;background:#7a4fe0;animation:d2 28s ease-in-out infinite alternate}
.o3{width:34vmax;height:34vmax;left:22vw;bottom:-18vmax;background:var(--tone);opacity:.3;transition:background .9s ease;animation:d3 25s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(18vmax,12vmax) scale(1.15)}}
@keyframes d2{to{transform:translate(-16vmax,10vmax) scale(.9)}}
@keyframes d3{to{transform:translate(14vmax,-12vmax) scale(1.2)}}
@keyframes grid{to{transform:translate(44px,44px)}}
@media(prefers-reduced-motion:reduce){.orb,.bg::before{animation:none}}
/* каркас: страница не прокручивается */
.app{position:relative;z-index:1;height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:12px;
  padding:max(14px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
h1{margin:0;font-size:22px;line-height:1.15;font-weight:700;letter-spacing:-.02em}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:3px;background:rgba(18,20,26,.7);border:1px solid var(--line);border-radius:10px}
.tabs button{border:0;border-radius:7px;background:none;color:var(--muted);font:500 14px inherit;font-family:inherit;padding:10px 6px;min-height:42px;cursor:pointer;transition:background .15s,color .15s}
.tabs button[aria-selected=true]{background:var(--surface2);color:var(--text)}
.stack{position:relative;flex:1;min-height:0}
.card{position:absolute;left:0;right:0;top:0;bottom:18px;padding:18px 16px;border-radius:18px;border:1px solid var(--line);
  background:rgba(27,30,39,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);overflow-y:auto;overscroll-behavior:contain;
  touch-action:pan-y;transform-origin:50% 100%;will-change:transform;
  transition:transform .32s cubic-bezier(.2,.8,.2,1),opacity .32s ease}
.card.front{z-index:2}
.card.back{z-index:1;transform:translateY(18px) scale(.94);opacity:.55;pointer-events:none;overflow:hidden}
.card.dragging{transition:none;-webkit-user-select:none;user-select:none}
.hint{margin:0;text-align:center;font-size:12px;color:var(--muted)}
/* поля */
.field{margin-bottom:16px}
.lbl,label{display:block;font-size:14px;color:var(--muted);margin-bottom:8px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{margin:0;min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 2px;border-radius:7px;cursor:pointer;color:var(--muted);font-size:13px;transition:background .15s,color .15s}
.seg input:checked+label{background:var(--surface2);color:var(--text)}
.seg input:focus-visible+label{outline:2px solid var(--accent);outline-offset:1px}
.num{display:flex;align-items:baseline;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:0 14px}
.num:focus-within{border-color:var(--accent)}
.num input{flex:1;min-width:0;background:none;border:0;color:var(--text);font:600 20px 'Onest',system-ui,sans-serif;min-height:48px;padding:0;outline:none;-moz-appearance:textfield}
.num input::-webkit-outer-spin-button,.num input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.num span{color:var(--muted);font-size:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;min-height:48px;border:0;border-radius:12px;background:var(--accent);color:#0c1220;font:600 16px inherit;font-family:inherit;cursor:pointer;margin-top:4px}
.btn.ghost{background:var(--surface2);color:var(--text);margin-top:16px}
/* результат */
.small{color:var(--muted);font-size:14px}
.range{font-size:32px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin-top:2px}
.verdict{display:inline-block;margin-top:8px;padding:4px 12px;border-radius:99px;font-size:14px;font-weight:600;background:var(--surface2)}
.scale{position:relative;margin:22px 0 6px}
.bar{display:flex;height:10px;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%}
.pin{position:absolute;top:-7px;width:4px;height:24px;margin-left:-2px;border-radius:2px;background:var(--text);box-shadow:0 0 0 3px #1b1e27;transition:left .35s ease}
.ticks{position:relative;height:18px;font-size:12px;color:var(--muted)}
.ticks span{position:absolute;transform:translateX(-50%)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:19px}
.stat span{font-size:13px;color:var(--muted)}
.advice{margin-top:14px;font-size:14px;background:var(--bg);border-left:3px solid var(--accent);border-radius:6px;padding:10px 12px}
.formulas{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.formulas h2{font-size:14px;margin:0 0 4px;font-weight:600}
.f{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:13px;color:var(--muted);border-bottom:1px dashed var(--line)}
.f:last-child{border-bottom:0}
.f b{color:var(--text);font-weight:600;white-space:nowrap}
.note{margin:14px 0 0;font-size:12px;color:var(--muted)}
.empty{color:var(--muted);padding:24px 0;text-align:center}
.warn{opacity:0;max-height:0;overflow:hidden;border-radius:10px;background:var(--surface2);border:1px solid var(--over);font-size:13px;padding:0 12px;animation:warnin .01s 2.5s forwards}
@keyframes warnin{to{opacity:1;max-height:120px;padding:10px 12px}}
html.ok .warn{display:none}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div></div>
<main class="app">
  <h1>Калькулятор нормы веса</h1>
  <div class="warn" role="alert">Результат не пересчитывается? Закройте и откройте приложение заново.</div>
  <div class="tabs" role="tablist">
    <button role="tab" id="t0" aria-selected="true">Данные</button>
    <button role="tab" id="t1" aria-selected="false">Результат</button>
  </div>
  <div class="stack">
    <section class="card front" id="c0" aria-label="Ваши данные">
      <div class="field"><span class="lbl">Пол</span>
        <div class="seg" role="radiogroup">
          <input type="radio" name="sex" id="sm" value="m" checked><label for="sm">Мужской</label>
          <input type="radio" name="sex" id="sf" value="f"><label for="sf">Женский</label>
        </div></div>
      <div class="field"><label for="age">Возраст</label>
        <div class="num"><input id="age" type="number" inputmode="numeric" min="18" max="100" value="30"><span>лет</span></div></div>
      <div class="row2 field">
        <div><label for="h">Рост</label><div class="num"><input id="h" type="number" inputmode="decimal" min="100" max="230" value="175"><span>см</span></div></div>
        <div><label for="w">Вес</label><div class="num"><input id="w" type="number" inputmode="decimal" min="25" max="300" value="72"><span>кг</span></div></div>
      </div>
      <div class="field"><span class="lbl">Телосложение</span>
        <div class="seg" role="radiogroup">
          <input type="radio" name="frame" id="fa" value="0.9"><label for="fa">Астеник</label>
          <input type="radio" name="frame" id="fn" value="1" checked><label for="fn">Нормостеник</label>
          <input type="radio" name="frame" id="fh" value="1.1"><label for="fh">Гиперстеник</label>
        </div></div>
      <button class="btn" id="go">Показать результат</button>
    </section>
    <section class="card back" id="c1" aria-label="Результат" aria-live="polite">
      <div id="out"><div class="empty">Считаем…</div></div>
      <p class="note">Расчёт ориентировочный и не заменяет консультацию врача. ИМТ не учитывает долю мышц; для детей, подростков и беременных нормы другие.</p>
      <button class="btn ghost" id="back">Изменить данные</button>
    </section>
  </div>
  <p class="hint">Смахните карточку в сторону</p>
</main>

<script>
(function(){
  var $ = function(id){return document.getElementById(id)};
  var out = $('out'), cards = [$('c0'), $('c1')], tabs = [$('t0'), $('t1')];
  var front = 0, busy = false;
  var tg = null;

  /* ---------- расчёт ---------- */
  var MIN = 15, MAX = 40;
  var cats = [
    {to:18.5,name:'Дефицит массы тела',color:'var(--under)'},
    {to:25,name:'Норма',color:'var(--ok)'},
    {to:30,name:'Избыточная масса',color:'var(--over)'},
    {to:35,name:'Ожирение I степени',color:'var(--obese)'},
    {to:40,name:'Ожирение II степени',color:'var(--obese)'},
    {to:999,name:'Ожирение III степени',color:'var(--obese)'}
  ];
  function pct(b){return Math.max(0,Math.min(100,(b-MIN)/(MAX-MIN)*100))}
  function fmt(n){return (Math.round(n*10)/10).toString().replace('.',',')}
  function kg(n){return fmt(n)+' кг'}

  function calc(){
    try{ run(); document.documentElement.className = 'ok'; }
    catch(e){ out.innerHTML = '<div class="empty">Не удалось посчитать: '+(e && e.message ? e.message : e)+'</div>'; }
  }
  function run(){
    var h = parseFloat($('h').value), w = parseFloat($('w').value), age = parseInt($('age').value,10);
    var male = $('sm').checked;
    var frame = parseFloat(document.querySelector('input[name=frame]:checked').value);
    if(!(h>=100 && h<=230) || !(w>=25 && w<=300)){
      out.innerHTML = '<div class="empty">Укажите рост от 100 до 230 см и вес от 25 до 300 кг.</div>';
      return;
    }
    var m = h/100, bmi = w/(m*m);
    var cat = cats.filter(function(c){return bmi<c.to})[0];
    document.querySelector('.bg').style.setProperty('--tone', cat.color);
    var lo = 18.5*m*m, hi = 24.9*m*m;
    var broca = (h-100)*(male?0.9:0.85)*frame;
    var devine = (male?50:45.5) + 2.3*(h/2.54-60);
    var lorentz = (h-100) - (h-150)/(male?4:2);
    var msg;
    if(age<18) msg = 'Для возраста младше 18 лет оценка по ИМТ неприменима.';
    else if(w<lo) msg = 'Не хватает около '+kg(lo-w)+' до нижней границы нормы.';
    else if(w>hi) msg = 'До верхней границы нормы около '+kg(w-hi)+'.';
    else msg = 'Ваш вес в пределах нормы.';
    var bar = '', prev = MIN, colors = ['var(--under)','var(--ok)','var(--over)','var(--obese)','var(--obese)'];
    [18.5,25,30,35,MAX].forEach(function(t,i){
      bar += '<i style="width:'+((t-prev)/(MAX-MIN)*100)+'%;background:'+colors[i]+(i==4?';opacity:.65':'')+'"></i>'; prev = t;
    });
    var ticks = [18.5,25,30,35].map(function(t){return '<span style="left:'+pct(t)+'%">'+fmt(t)+'</span>'}).join('');
    out.innerHTML =
      '<div class="small">Нормальный вес при росте '+fmt(h)+' см</div>' +
      '<div class="range">'+fmt(lo)+' – '+fmt(hi)+' кг</div>' +
      '<span class="verdict" style="color:'+cat.color+'">'+cat.name+'</span>' +
      '<div class="scale"><div class="bar">'+bar+'</div><div class="pin" style="left:'+pct(bmi)+'%"></div></div>' +
      '<div class="ticks">'+ticks+'</div>' +
      '<div class="stats"><div class="stat"><b>'+fmt(bmi)+'</b><span>Индекс массы тела</span></div>' +
      '<div class="stat"><b>'+kg(w)+'</b><span>Ваш вес</span></div></div>' +
      '<div class="advice">'+msg+'</div>' +
      '<div class="formulas"><h2>Идеальный вес по формулам</h2>' +
      '<div class="f"><span>Брока (с учётом телосложения)</span><b>'+kg(broca)+'</b></div>' +
      '<div class="f"><span>Девайн</span><b>'+kg(devine)+'</b></div>' +
      '<div class="f"><span>Лоренц</span><b>'+kg(lorentz)+'</b></div></div>';
  }

  /* ---------- стопка карточек ---------- */
  function haptic(kind){
    try{ if(tg && tg.HapticFeedback){ kind==='tick' ? tg.HapticFeedback.selectionChanged() : tg.HapticFeedback.impactOccurred('light'); } }catch(e){}
  }
  function layout(){
    cards.forEach(function(c,i){
      var isFront = i===front;
      c.classList.toggle('front', isFront);
      c.classList.toggle('back', !isFront);
      c.setAttribute('aria-hidden', isFront ? 'false' : 'true');
      if(isFront) c.removeAttribute('inert'); else c.setAttribute('inert','');
      tabs[i].setAttribute('aria-selected', isFront ? 'true' : 'false');
    });
    cards[front].scrollTop = 0;
  }
  function flip(dir){
    if(busy) return;
    busy = true; dir = dir || 1;
    var c = cards[front];
    c.classList.remove('dragging');
    c.style.transform = 'translateX('+(dir*window.innerWidth*1.1)+'px) rotate('+(dir*14)+'deg)';
    c.style.opacity = '0';
    haptic('impact');
    setTimeout(function(){
      c.style.transition = 'none';
      c.style.transform = ''; c.style.opacity = '';
      front = 1 - front;
      layout();
      void c.offsetWidth;
      c.style.transition = '';
      busy = false;
    }, 300);
  }
  function showCard(i){ if(i!==front) flip(i>front?1:-1); }

  cards.forEach(function(card){
    var sx=0, sy=0, dx=0, t0=0, active=false, started=false;
    card.addEventListener('pointerdown', function(e){
      if(busy || card!==cards[front]) return;
      sx=e.clientX; sy=e.clientY; dx=0; t0=Date.now(); active=true; started=false;
    });
    card.addEventListener('pointermove', function(e){
      if(!active) return;
      var mx=e.clientX-sx, my=e.clientY-sy;
      if(!started){
        if(Math.abs(mx)>10 && Math.abs(mx)>Math.abs(my)*1.2){
          started=true; card.classList.add('dragging');
          try{ card.setPointerCapture(e.pointerId); }catch(_){}
        } else { if(Math.abs(my)>10) active=false; return; }
      }
      dx=mx;
      card.style.transform='translateX('+dx+'px) rotate('+(dx/20)+'deg)';
      card.style.opacity=String(1-Math.min(Math.abs(dx)/(window.innerWidth*1.2),.6));
    });
    function end(cancel){
      if(!active) return; active=false;
      if(!started) return;
      card.classList.remove('dragging');
      var speed=Math.abs(dx)/Math.max(1,Date.now()-t0);
      if(!cancel && (Math.abs(dx)>card.offsetWidth*0.28 || (speed>0.5 && Math.abs(dx)>40))) flip(dx>0?1:-1);
      else { card.style.transform=''; card.style.opacity=''; }
    }
    card.addEventListener('pointerup', function(){ end(false); });
    card.addEventListener('pointercancel', function(){ end(true); });
  });

  tabs.forEach(function(t,i){ t.addEventListener('click', function(){ showCard(i); }); });
  $('go').addEventListener('click', function(){ showCard(1); });
  $('back').addEventListener('click', function(){ showCard(0); });
  document.addEventListener('keydown', function(e){
    var t = e.target && e.target.tagName;
    if(t==='INPUT') return;
    if(e.key==='ArrowLeft') flip(-1); else if(e.key==='ArrowRight') flip(1);
  });

  ['h','w','age'].forEach(function(id){ $(id).addEventListener('input', calc); });
  document.querySelectorAll('input[type=radio]').forEach(function(r){
    r.addEventListener('change', function(){ calc(); haptic('tick'); });
  });

  /* ---------- Telegram ---------- */
  function tgInit(){
    try{
      tg = window.Telegram && window.Telegram.WebApp;
      if(!tg || tgInit.done) return;
      tgInit.done = true;
      tg.ready(); tg.expand();
      if(tg.disableVerticalSwipes) tg.disableVerticalSwipes();
      if(tg.setHeaderColor) tg.setHeaderColor('#12141a');
      if(tg.setBackgroundColor) tg.setBackgroundColor('#12141a');
    }catch(e){}
  }
  layout(); calc(); tgInit();
  window.addEventListener('load', function(){ calc(); tgInit(); });
})();
</script>
</body>
</html>
